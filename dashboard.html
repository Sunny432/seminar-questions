<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>질문 대시보드</title>
  <style>
    :root {
      --bg: #f2f3f6; --card: #fff; --ink: #161b26; --muted: #5f6675; --faint: #8a909c; --line: #e2e5ea;
      --accent: #1f4fd1; --accent-bg: #e8eeff;
      --ok: #0d7a49; --ok-bg: #e3f5ec; --first: #12a15c;
      --star: #b35f00; --star-bg: #fff0d4; --star-line: #f0a500;
      --err: #b42318; --err-bg: #fdecea;
    }
    /* 글자 크게: 모든 크기를 rem 으로 지정해 루트 크기만 바꾼다 */
    html { font-size: 16px; }
    html.large { font-size: 19px; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      font-size: 1rem; line-height: 1.5; -webkit-text-size-adjust: 100%;
    }
    button { font: inherit; cursor: pointer; color: inherit; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 12px 48px; }

    /* ---- 상단 (스크롤해도 고정) ---- */
    .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 8px; }
    .top-row { display: flex; align-items: center; gap: 8px; }
    .title { flex: 1; min-width: 0; }
    .title h1 { margin: 0; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title .sub { color: var(--faint); font-size: .8rem; }
    .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 5px; vertical-align: middle; }
    .live.stale { background: var(--err); }
    .icon-btn { flex: none; min-width: 44px; height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: .9rem; }
    .icon-btn.on { background: var(--accent-bg); border-color: var(--accent-bg); color: var(--accent); }
    .intake { display: block; width: 100%; margin-top: 8px; padding: 11px 14px; border-radius: 12px; border: 0; font-weight: 700; font-size: .95rem; text-align: left; }
    .intake.open { background: var(--ok); color: #fff; }
    .intake.closed { background: #2b3242; color: #fff; }
    .intake.arm { background: var(--err); color: #fff; }
    .intake .hint { float: right; font-weight: 500; opacity: .85; }

    .error { background: var(--err-bg); color: var(--err); border-radius: 10px; padding: 10px 12px; margin: 4px 0 10px; font-size: .9rem; }

    /* ---- 전원 질문 목표 ---- */
    .plan { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 4px 0 10px; }
    .plan-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .plan-title { font-weight: 700; font-size: .95rem; }
    .plan-main { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .progress { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0 8px; }
    .progress div { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s; }
    .plan.met .progress div { background: var(--ok); }
    .plan.met .plan-main { color: var(--ok); }
    .plan-foot { font-size: .82rem; color: var(--muted); }
    .plan-foot div + div { margin-top: 2px; }

    /* ---- 탭 (한 줄, 넘치면 가로 스크롤) ---- */
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 7px 13px; font-size: .88rem; font-weight: 600; color: var(--muted); }
    .tabs button.on { background: var(--ink); border-color: var(--ink); color: #fff; }

    /* ---- 목록 ---- */
    .sec { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 14px 2px 8px; }
    .sec h2 { margin: 0; font-size: .95rem; }
    .sec h2 span { color: var(--faint); font-weight: 600; margin-left: 4px; }
    .sec select { font: inherit; font-size: .8rem; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--muted); }

    .q { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 12px 16px; margin-bottom: 10px; overflow: hidden; }
    .q.first::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--first); }
    .q.selected { border-color: var(--star-line); background: #fffaf0; }
    .q.done, .q.hidden-q { opacity: .55; }
    .q-head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
    .num { display: inline-flex; align-items: center; justify-content: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--star-line); color: #fff; font-weight: 800; font-size: .85rem; }
    .q-head strong { font-size: 1.05rem; }
    .meta { color: var(--faint); font-size: .8rem; }
    .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .tag { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #eef0f3; color: var(--muted); }
    .tag.first { background: var(--ok-bg); color: var(--ok); }
    .tag.today { background: var(--star-bg); color: var(--star); }
    .text { margin: 8px 0 10px; font-size: 1.15rem; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
    .actions { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
    .actions button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: .92rem; }
    .actions button:only-child { grid-column: 1 / -1; }
    .actions .star { background: var(--star-line); border-color: var(--star-line); color: #fff; }
    .actions .ok { background: var(--ok); border-color: var(--ok); color: #fff; }
    .empty { text-align: center; color: var(--faint); padding: 28px 0; font-size: .9rem; }

    /* ---- 수강생 현황 ---- */
    .roster { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .roster li { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); }
    .roster li:first-child { border-top: 0; }
    .roster .who { flex: 1; min-width: 0; }
    .roster .who div { font-size: .78rem; color: var(--faint); }
    .roster .cnt { font-size: 1.2rem; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 2.2rem; text-align: right; }
    .roster .cnt.zero { color: var(--first); }
    .roster .plus { font-size: .75rem; color: var(--star); font-weight: 700; }

    /* ---- QR ---- */
    .overlay { position: fixed; inset: 0; background: rgba(15, 20, 30, .75); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
    .overlay[hidden] { display: none; }
    .qrbox { background: #fff; border-radius: 18px; padding: 22px; text-align: center; max-width: 92vw; }
    .qrbox h2 { margin: 0 0 4px; font-size: 1.5rem; }
    .qrbox p { margin: 0 0 14px; color: var(--muted); font-size: .9rem; }
    #qr { display: inline-block; }
    #qr img, #qr canvas { width: min(60vh, 78vw) !important; height: auto !important; }
    .qrurl { font-size: .75rem; color: var(--faint); word-break: break-all; margin-top: 10px; }
  </style>
  <!-- 내 컴퓨터에서 열면(localhost/파일) 가짜 서버로 동작하는 데모 모드 -->
  <script>if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) || location.protocol === 'file:') document.write('<script src="demo-mock.js"><\/script>');</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body data-key="<?= key ?>">
  <main class="wrap">
    <header class="top">
      <div class="top-row">
        <div class="title">
          <h1 id="course">질문 대시보드</h1>
          <div class="sub"><span class="live" id="live"></span><span id="date"></span> · <span id="updated">불러오는 중…</span></div>
        </div>
        <button class="icon-btn" id="roster-btn" title="수강생별 선정 횟수">명단</button>
        <button class="icon-btn" id="size-btn" title="글자 크기">가</button>
        <button class="icon-btn" id="qr-btn" title="학생용 QR 띄우기">QR</button>
      </div>
      <button class="intake closed" id="open-btn" disabled>…</button>
    </header>

    <div class="error" id="error" hidden></div>

    <section class="plan" id="plan">
      <div class="plan-row"><span class="plan-title">오늘 첫 질문자</span><span class="plan-main" id="plan-main">–</span></div>
      <div class="progress"><div id="plan-bar"></div></div>
      <div class="plan-foot" id="plan-foot"></div>
    </section>

    <nav class="tabs" id="tabs"></nav>

    <section id="questions-view"><div id="list"></div></section>
    <section id="roster-view" hidden>
      <div class="sec"><h2>수강생별 선정 횟수 <span>적은 순</span></h2></div>
      <ul class="roster" id="roster-list"></ul>
    </section>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="qrbox">
      <h2>질문 제출</h2>
      <p>휴대폰으로 찍고 학번·이름 확인 후 질문을 남겨 주세요</p>
      <div id="qr"></div>
      <div class="qrurl" id="qr-url"></div>
    </div>
  </div>

  <script>
    // Apps Script 페이지로 열면 템플릿이 key를 넣어 주고, GitHub Pages로 열면 주소의 #key=... 에서 읽는다
    const KEY = (() => {
      const t = document.body.dataset.key || '';
      if (t && t.indexOf('<' + '?') < 0) return t; // '<'+'?' : Apps Script 템플릿 표기와 겹치지 않게 나눠 씀
      return new URLSearchParams(location.hash.slice(1)).get('key') || new URLSearchParams(location.search).get('key') || '';
    })();
    const STATUS = { WAITING: '대기', SELECTED: '선정', DONE: '완료', HIDDEN: '숨김' };
    // '진행 중' = 선정된 질문(호명 순서) + 대기 질문
    const FILTERS = [
      { key: 'active', label: '진행 중', match: q => q.status === STATUS.WAITING || q.status === STATUS.SELECTED },
      { key: STATUS.DONE, label: '완료', match: q => q.status === STATUS.DONE },
      { key: STATUS.HIDDEN, label: '숨김', match: q => q.status === STATUS.HIDDEN },
      { key: 'all', label: '전체', match: () => true },
    ];
    const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
    const $ = id => document.getElementById(id);

    let data = null;
    let view = 'active';      // FILTERS 의 key 또는 'roster'
    let sortMode = pref('sort') || 'fair';
    let pending = 0;          // 진행 중인 조작 수
    let version = 0;          // 조작할 때마다 증가 → 조작 전에 요청한 응답은 버림
    let inflight = false;
    let lastOk = 0;
    let closeArmedUntil = 0;  // 마감은 3초 안에 두 번 눌러야 실행

    // 이 기기에만 기억하는 화면 설정 (정렬, 글자 크기)
    function pref(name, value) {
      try {
        if (value === undefined) return localStorage.getItem('dash-' + name);
        localStorage.setItem('dash-' + name, value);
      } catch (e) { return null; }
    }
    if (pref('large') === '1') document.documentElement.classList.add('large');

    // Apps Script 웹앱(Code.gs 의 doPost)에 요청. text/plain 본문이라 CORS 사전 요청이 없다.
    const API_URL = 'https://script.google.com/macros/s/AKfycbyMjR0euIFOc_cl6aO2qeAB9EEREH8fs4KpbxBGlcxJEty3IWT3nxEQmZ3P5f3h2RA6hQ/exec';
    async function call(fn, ...args) {
      if (window.DEMO_API) return window.DEMO_API(fn, args);
      let out;
      try {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, args }) });
        out = await res.json();
      } catch (e) {
        throw new Error('서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.');
      }
      if (!out.ok) throw new Error(out.error);
      return out.data;
    }
    function errText(e) { return String((e && e.message) || e).replace(/^(Error|Exception):\s*/, ''); }
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function showError(msg) { $('error').hidden = !msg; $('error').textContent = msg || ''; }

    function render() {
      if (!data) return;
      $('course').textContent = data.course;
      $('date').textContent = data.today;
      renderIntake();
      renderPlan();
      renderTabs();
      $('questions-view').hidden = view === 'roster';
      $('roster-view').hidden = view !== 'roster';
      if (view === 'roster') renderRoster(); else renderList();
    }

    function renderIntake() {
      const ob = $('open-btn');
      ob.disabled = false;
      const armed = data.open && Date.now() < closeArmedUntil;
      ob.className = 'intake ' + (armed ? 'arm' : data.open ? 'open' : 'closed');
      ob.innerHTML = armed
        ? '한 번 더 누르면 마감됩니다'
        : data.open
          ? '● 질문 접수 중<span class="hint">눌러서 마감</span>'
          : '○ 접수 마감됨<span class="hint">눌러서 시작</span>';
    }

    function renderPlan() {
      const p = data.plan;
      const set = (main, lines, ratio, met) => {
        $('plan-main').textContent = main;
        $('plan-foot').innerHTML = lines.filter(Boolean).map(l => '<div>' + esc(l) + '</div>').join('');
        $('plan-bar').style.width = Math.round(Math.max(0, Math.min(1, ratio)) * 100) + '%';
        $('plan').classList.toggle('met', !!met);
      };
      if (!p.total) return set('–', ["'설정' 시트에 전체수업횟수를 입력하면 목표가 계산됩니다."], 0);
      const status = '남은 수업 ' + Math.max(p.remaining, 0) + '회(오늘 포함) · 아직 0회 ' + p.zeroBefore + '명 / ' + data.roster.length + '명';
      if (p.zeroBefore === 0) return set('달성', ['모든 수강생이 한 번 이상 질문했습니다.', status], 1, true);
      if (p.remaining <= 0) {
        return set(p.firstToday + ' / ' + p.zeroBefore + '명', ['남은 수업이 없습니다. 0회 학생을 오늘 모두 선정해야 합니다.', status],
          p.firstToday / p.zeroBefore, p.firstToday >= p.zeroBefore);
      }
      const zeroAfter = p.zeroBefore - p.firstToday;
      const remAfter = p.remaining - 1;
      let next;
      if (zeroAfter <= 0) next = '오늘로 모든 수강생이 한 번 이상 질문하게 됩니다.';
      else if (remAfter > 0) next = '이대로 끝나면 다음 수업부터 회당 최소 ' + Math.ceil(zeroAfter / remAfter) + '명';
      else next = '오늘이 마지막 수업입니다.';
      set(p.firstToday + ' / ' + p.target + '명', [status, next], p.firstToday / p.target, p.firstToday >= p.target);
    }

    function renderTabs() {
      const qs = data.questions;
      $('tabs').innerHTML = FILTERS.map(f =>
        '<button data-view="' + f.key + '" class="' + (view === f.key ? 'on' : '') + '">' + f.label + ' ' + qs.filter(f.match).length + '</button>'
      ).join('');
      $('roster-btn').classList.toggle('on', view === 'roster');
    }

    const total = q => q.pastSelected + q.todaySelected;
    const byTime = (a, b) => a.ts - b.ts;
    const bySort = (a, b) => sortMode === 'fair' ? total(a) - total(b) || byTime(a, b) : byTime(a, b);

    function renderList() {
      const f = FILTERS.find(x => x.key === view);
      const qs = data.questions.filter(f.match);
      if (view !== 'active') {
        $('list').innerHTML = qs.length ? qs.sort(bySort).map(q => card(q)).join('') : '<div class="empty">해당하는 질문이 없습니다.</div>';
        return;
      }
      // 진행 중: 호명 순서(선정한 순) → 대기 중(선택한 정렬)
      const picked = qs.filter(q => q.status === STATUS.SELECTED).sort(byTime);
      const waiting = qs.filter(q => q.status === STATUS.WAITING).sort(bySort);
      let html = '';
      if (picked.length) {
        html += '<div class="sec"><h2>호명 순서<span>' + picked.length + '</span></h2></div>' + picked.map((q, i) => card(q, i)).join('');
      }
      html += '<div class="sec"><h2>대기 중<span>' + waiting.length + '</span></h2>' +
        '<select id="sort" aria-label="정렬">' +
        '<option value="fair"' + (sortMode === 'fair' ? ' selected' : '') + '>선정 적은 학생 먼저</option>' +
        '<option value="time"' + (sortMode === 'time' ? ' selected' : '') + '>접수 순서</option>' +
        '</select></div>';
      html += waiting.length ? waiting.map(q => card(q)).join('') : '<div class="empty">대기 중인 질문이 없습니다.</div>';
      $('list').innerHTML = html;
    }

    function card(q, pickIndex) {
      const cls = [
        q.pastSelected === 0 ? 'first' : '',
        { [STATUS.SELECTED]: 'selected', [STATUS.DONE]: 'done', [STATUS.HIDDEN]: 'hidden-q' }[q.status] || '',
      ].join(' ');
      const num = pickIndex !== undefined ? '<span class="num">' + (CIRCLED[pickIndex] || pickIndex + 1) + '</span>' : '';
      const tags =
        (q.pastSelected === 0 ? '<span class="tag first">첫 질문</span>' : '<span class="tag">지난 선정 ' + q.pastSelected + '회</span>') +
        (q.status === STATUS.WAITING && q.todaySelected > 0 ? '<span class="tag today">오늘 이미 선정됨</span>' : '');
      return '<article class="q ' + cls + '">' +
        '<div class="q-head">' + num + '<strong>' + esc(q.name) + '</strong><span class="meta">' + esc(q.studentId) + ' · ' + esc(q.time) + '</span></div>' +
        '<div class="tags">' + tags + '</div>' +
        '<p class="text">' + esc(q.text) + '</p>' +
        '<div class="actions">' + actionsFor(q) + '</div>' +
        '</article>';
    }

    function actionsFor(q) {
      const b = (status, label, cls) =>
        '<button data-id="' + esc(q.id) + '" data-status="' + status + '" class="' + (cls || '') + '">' + label + '</button>';
      switch (q.status) {
        case STATUS.WAITING: return b(STATUS.SELECTED, '⭐ 선정', 'star') + b(STATUS.HIDDEN, '숨김');
        case STATUS.SELECTED: return b(STATUS.DONE, '✓ 답변 완료', 'ok') + b(STATUS.WAITING, '선정 취소');
        case STATUS.DONE: return b(STATUS.SELECTED, '선정으로 되돌리기');
        case STATUS.HIDDEN: return b(STATUS.WAITING, '복원');
        default: return b(STATUS.WAITING, '대기로');
      }
    }

    function renderRoster() {
      const rows = data.roster.slice().sort((a, b) => total(a) - total(b) || String(a.id).localeCompare(String(b.id)));
      $('roster-list').innerHTML = rows.map(r => {
        const t = total(r);
        return '<li><div class="who"><strong>' + esc(r.name) + '</strong><div>' + esc(r.id) + '</div></div>' +
          (r.todaySelected ? '<span class="plus">오늘 +' + r.todaySelected + '</span>' : '') +
          '<span class="cnt' + (t === 0 ? ' zero' : '') + '">' + t + '회</span></li>';
      }).join('');
    }

    async function refresh() {
      if (pending || inflight) return;
      inflight = true;
      const v = version;
      try {
        const next = await call('getDashboard', KEY);
        if (pending || v !== version) return;
        data = next;
        lastOk = Date.now();
        showError('');
        render();
      } catch (e) {
        showError('불러오기 실패: ' + errText(e));
      } finally {
        inflight = false;
      }
    }

    function tickClock() {
      if (!lastOk) return;
      const sec = Math.round((Date.now() - lastOk) / 1000);
      $('updated').textContent = sec < 3 ? '실시간' : sec + '초 전';
      $('live').classList.toggle('stale', sec > 20);
    }

    async function changeStatus(id, status) {
      const q = data.questions.find(x => x.id === id);
      if (!q) return;
      const wasSel = q.status === STATUS.SELECTED || q.status === STATUS.DONE;
      const isSel = status === STATUS.SELECTED || status === STATUS.DONE;
      const delta = (isSel ? 1 : 0) - (wasSel ? 1 : 0);
      // 화면을 먼저 갱신하고 서버에 반영
      q.status = status;
      if (q.pastSelected === 0 && delta !== 0) {
        const before = q.todaySelected, after = before + delta;
        if (before === 0 && after > 0) data.plan.firstToday++;
        if (before > 0 && after === 0) data.plan.firstToday--;
      }
      data.questions.forEach(x => { if (x.studentId === q.studentId) x.todaySelected += delta; });
      const r = data.roster.find(x => x.id === q.studentId);
      if (r) r.todaySelected += delta;
      render();
      pending++;
      version++;
      try {
        await call('setStatus', KEY, id, status);
      } catch (e) {
        showError('변경 실패: ' + errText(e));
      } finally {
        pending--;
        inflight = false;
        refresh();
      }
    }

    $('list').addEventListener('click', e => {
      const btn = e.target.closest('button[data-id]');
      if (btn) changeStatus(btn.dataset.id, btn.dataset.status);
    });
    $('list').addEventListener('change', e => {
      if (e.target.id !== 'sort') return;
      sortMode = e.target.value;
      pref('sort', sortMode);
      renderList();
    });
    $('tabs').addEventListener('click', e => {
      const btn = e.target.closest('button[data-view]');
      if (!btn) return;
      view = btn.dataset.view;
      render();
    });

    $('open-btn').addEventListener('click', async () => {
      const next = !data.open;
      // 실수로 마감하지 않도록 3초 안에 한 번 더 눌러야 마감 (브라우저 확인창은 환경에 따라 차단됨)
      if (!next && Date.now() >= closeArmedUntil) {
        closeArmedUntil = Date.now() + 3000;
        renderIntake();
        setTimeout(renderIntake, 3100);
        return;
      }
      closeArmedUntil = 0;
      data.open = next;
      render();
      pending++;
      version++;
      try {
        await call('setOpen', KEY, next);
      } catch (e) {
        showError('변경 실패: ' + errText(e));
      } finally {
        pending--;
        inflight = false;
        refresh();
      }
    });

    $('roster-btn').addEventListener('click', () => {
      view = view === 'roster' ? 'active' : 'roster';
      render();
      window.scrollTo(0, 0);
    });

    $('size-btn').addEventListener('click', () => {
      const large = document.documentElement.classList.toggle('large');
      $('size-btn').classList.toggle('on', large);
      pref('large', large ? '1' : '0');
    });
    $('size-btn').classList.toggle('on', document.documentElement.classList.contains('large'));

    $('qr-btn').addEventListener('click', () => {
      if (!data) return;
      // GitHub Pages에서 열었으면 같은 사이트의 학생 페이지, 아니면 서버가 알려준 학생 주소
      const url = location.hostname.endsWith('github.io') ? new URL('./', location.href).href : data.studentUrl;
      $('qr').innerHTML = '';
      if (window.QRCode) new QRCode($('qr'), { text: url, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
      else $('qr').textContent = 'QR 라이브러리를 불러오지 못했습니다. 아래 주소를 안내해 주세요.';
      $('qr-url').textContent = url;
      $('overlay').hidden = false;
    });
    $('overlay').addEventListener('click', () => { $('overlay').hidden = true; });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') $('overlay').hidden = true; });

    refresh();
    setInterval(refresh, 4000);
    setInterval(tickClock, 1000);
  </script>
</body>
</html>
